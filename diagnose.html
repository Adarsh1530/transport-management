<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Diagnostic</title>
</head>
<body>
  <pre id="output" style="font-family: monospace; font-size: 13px; white-space: pre-wrap;"></pre>

  <script src="js/data.js?v=22"></script>
  <script src="js/utils.js?v=22"></script>
  <script src="js/motion.js?v=22"></script>
  <script src="js/auth.js?v=22"></script>

  <script>
    const out = document.getElementById('output');
    function log(msg, color) {
      const div = document.createElement('div');
      div.style.color = color || '#000';
      div.textContent = msg;
      out.appendChild(div);
    }

    try {
      log('=== VMS Login Diagnostic ===', '#1e40af');
      log('');

      // 1. Check window.db
      if (typeof window.db === 'undefined') {
        log('❌ ERROR: window.db is undefined! data.js failed to load or has errors.', 'red');
      } else {
        log('✅ window.db is defined', 'green');
      }

      // 2. Check window.auth
      if (typeof window.auth === 'undefined') {
        log('❌ ERROR: window.auth is undefined! auth.js failed to load or has errors.', 'red');
      } else {
        log('✅ window.auth is defined', 'green');
      }

      // 3. Check DEMO_USERS
      if (typeof DEMO_USERS === 'undefined') {
        log('❌ ERROR: DEMO_USERS is undefined!', 'red');
      } else {
        log('✅ DEMO_USERS has ' + DEMO_USERS.length + ' users', 'green');
      }

      // 4. Try calling getUsers()
      try {
        const users = window.auth.getUsers();
        log('✅ auth.getUsers() returned ' + users.length + ' users', 'green');
        users.forEach(u => {
          log('   - username: ' + u.username + ' | role: ' + u.role + ' | password: ' + u.password, '#555');
        });
      } catch(e) {
        log('❌ auth.getUsers() threw error: ' + e.message, 'red');
      }

      // 5. Try login
      try {
        const result = window.auth.login('superadmin', 'super123', 'Super Admin');
        if (result.success) {
          log('✅ Login succeeded! User: ' + result.user.name, 'green');
        } else {
          log('❌ Login FAILED: ' + result.message, 'red');
        }
      } catch(e) {
        log('❌ auth.login() threw error: ' + e.message, 'red');
        log('   Stack: ' + e.stack, '#c00');
      }

      // 6. Check EXPENSE_VISIBILITY_KEY
      if (typeof EXPENSE_VISIBILITY_KEY === 'undefined') {
        log('⚠️ WARNING: EXPENSE_VISIBILITY_KEY is not defined (used in auth.js)', 'orange');
      } else {
        log('✅ EXPENSE_VISIBILITY_KEY = ' + EXPENSE_VISIBILITY_KEY, 'green');
      }

      // 7. Check localStorage
      try {
        localStorage.setItem('_test', '1');
        localStorage.removeItem('_test');
        log('✅ localStorage works', 'green');
      } catch(e) {
        log('❌ localStorage not available: ' + e.message, 'red');
      }

      log('');
      log('=== Diagnostic complete ===', '#1e40af');

    } catch(e) {
      log('FATAL: ' + e.message, 'red');
      log(e.stack, '#c00');
    }
  </script>
</body>
</html>
